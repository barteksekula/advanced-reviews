name: Build .net core

on:
  push:
    branches: [ master, cms12_master ]
  pull_request:
    branches: [ master, cms12_master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    outputs:
      report-archived: ${{ steps.archive-report.outcome == 'success' }}

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.102
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.18.0"
    - name: Install client dependencies
      run: setup.cmd
      shell: cmd
    - name: Build
      run: build.cmd Release
      shell: cmd
    - name: Install Playwright browsers
      run: pwsh test/Advanced.CMS.AdvancedReviews.E2ETests/bin/Release/playwright.ps1 install chromium
    - name: Test
      id: test
      run: test.cmd Release
      shell: cmd
      env:
        E2E_RECORD: 1
    - name: Generate test report
      if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
      run: dotnet run build/TestReport.cs -- artifacts/test-results test/Advanced.CMS.AdvancedReviews.E2ETests/bin/Release/videos test/Advanced.CMS.AdvancedReviews.E2ETests/bin/Release/traces artifacts/test-report
      env:
        REPORT_PUBLIC_URL: https://barteksekula.github.io/advanced-reviews
    - name: Archive test report
      id: archive-report
      if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: artifacts/test-report/
    - name: Pack
      run: pack.cmd Release
      shell: cmd
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: |
          artifacts/packages/*.nupkg

  publish-report:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.report-archived == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
    - name: Download test report
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: test-report
    - name: Upload test report to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-report
    - name: Deploy test report
      id: deployment
      uses: actions/deploy-pages@v4
